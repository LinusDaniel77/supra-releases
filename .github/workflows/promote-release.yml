name: Promote release

# Promotes a public beta after its Windows recovery installer and update
# metadata have been attached and verified.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to promote, e.g. v0.8.0
        required: true
        type: string
      public_assets_verified:
        description: Confirm the public installer and checksums were reviewed
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: promote-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  promote:
    name: Promote ${{ inputs.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Require the public recovery assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.public_assets_verified }}" = "true" || {
            echo "::error::Review the public recovery assets before promotion."
            exit 1
          }
          assets="$(gh release view "${{ inputs.tag }}" --repo "$GITHUB_REPOSITORY" \
                    --json assets --jq '.assets[].name')"
          echo "$assets"
          grep -Fxq 'Supra-Setup.exe' <<<"$assets"
          grep -Fxq 'latest.yml' <<<"$assets"
          grep -Eq '^Supra-Setup-.*\.exe\.sha256$' <<<"$assets"

      - name: Clear the prerelease flag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Set both flags so the notes page is the latest public announcement.
          gh release edit "${{ inputs.tag }}" --repo "$GITHUB_REPOSITORY" \
            --prerelease=false --latest

          state="$(gh release view "${{ inputs.tag }}" --repo "$GITHUB_REPOSITORY" \
                   --json isPrerelease --jq .isPrerelease)"
          test "$state" = "false"

          latest="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          echo "latest is now: $latest"
          test "$latest" = "${{ inputs.tag }}"
          {
            echo "### Promoted \`${{ inputs.tag }}\`"
            echo
            echo "It is now the newest public beta release and update source."
          } >> "$GITHUB_STEP_SUMMARY"
