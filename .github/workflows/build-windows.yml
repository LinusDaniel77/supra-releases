name: Build Windows installer

# The Windows counterpart to "Build macOS installer". Until this existed, the
# Windows half of a release could only be cut from somebody's laptop, which is
# why scripts/build_desktop.ps1 calls a build venv "a BUILD machine
# requirement": there was always a machine.
#
# Recovery releases are public while the unfinished account system is offline.
# A publish run attaches the verified installer and metadata to GitHub.

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Commit, tag, or branch from the private source repository
        required: true
        default: main
        type: string
      release_tag:
        description: Version tag, e.g. v0.11.52 (must match desktop/package.json at source_ref)
        required: true
        type: string
      publish:
        description: Publish the verified installer to the public GitHub release
        required: true
        default: false
        type: boolean

# Read-only by default. The build job runs code from source_ref (npm scripts,
# build tools, the project's own build script), so it must never hold a token
# that can write this repository's releases (security audit 2026-11, h14). Only
# the publish job below can, and it runs no code from the source repository:
# it uploads the files the build job verified.
permissions:
  contents: read

concurrency:
  group: windows-installer
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify Windows x64
    runs-on: windows-latest
    timeout-minutes: 120
    outputs:
      installer: ${{ steps.artifact.outputs.installer }}
      signing_required: ${{ steps.signing.outputs.required }}

    # Inputs reach run: scripts only through these variables. An expression
    # spliced into a script is substituted before the shell parses it, so a
    # value with a quote or $(...) in it would run as code.
    env:
      PUBLISH: ${{ inputs.publish }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      SOURCE_REF: ${{ inputs.source_ref }}
    steps:
      - name: Check out private source with repository-scoped read-only key
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: LinusDaniel77/Silvia-Supra
          ref: ${{ inputs.source_ref }}
          ssh-key: ${{ secrets.SUPRA_SOURCE_DEPLOY_KEY }}
          persist-credentials: false
          path: source

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            source/web/package-lock.json
            source/desktop/package-lock.json

      # build_desktop.ps1 asks the build interpreter for its exact version and
      # downloads the matching python-<version>-embed-amd64.zip. Pin PATCH: a
      # floating 3.13 silently moved the release builder from the locally proven
      # 3.13.9 runtime to 3.13.15, whose native CAD stack returned 0 and then
      # crashed during interpreter teardown with 0xC0000374.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.9"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: source/uv.lock

      - name: Confirm the release tag matches the source
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./source/desktop/package.json').version")"
          echo "package_version=$version release_tag=${RELEASE_TAG}"
          test "v$version" = "${RELEASE_TAG}"

      - name: Build web application
        working-directory: source/web
        run: |
          npm ci
          npm run build
          npm run kernel:bundle

      - name: Install desktop packaging dependencies
        working-directory: source/desktop
        run: npm ci

      - name: Test desktop updater and runtime contracts
        working-directory: source/desktop
        run: npm run check

      # "No build venv at .venv313 (this is a BUILD machine requirement only)."
      # The runner is the build machine now, so it grows one.
      - name: Create the build venv the installer is assembled from
        working-directory: source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:UV_PROJECT_ENVIRONMENT = ".venv313"
          uv sync --frozen --no-dev --python python
          if ($LASTEXITCODE -ne 0) { throw "uv sync failed with exit $LASTEXITCODE" }

          # build_desktop.ps1 reads the interpreter version out of pyvenv.cfg to
          # pick the matching python-<version>-embed-amd64.zip, and its parser
          # matches `^\s*version\s*=` -- the spelling the stdlib venv writes.
          # uv writes `version_info = 3.13.9` instead, so the script cannot read
          # a uv-made venv and stops at "Could not read the Python version from
          # pyvenv.cfg" before assembling anything. Add the stdlib spelling.
          $cfg = ".venv313\pyvenv.cfg"
          if (-not (Select-String -Path $cfg -Pattern '^\s*version\s*=' -Quiet)) {
            $v = & .\.venv313\Scripts\python.exe -c "import sys; print('.'.join(map(str, sys.version_info[:3])))"
            if ($LASTEXITCODE -ne 0) { throw "could not read the venv interpreter version" }
            Add-Content -Path $cfg -Value "version = $v"
            Write-Host "pyvenv.cfg: added stdlib-style 'version = $v' for build_desktop.ps1"
          }

          # Import the native CAD stack and require a clean interpreter exit.
          # Merely printing success is insufficient: incompatible CasADi builds
          # have printed it and then crashed during Windows process teardown.
          & .\.venv313\Scripts\python.exe -c "import sys, cadquery, vtkmodules, pydantic, fastapi, anthropic, silvia; print(sys.version); print('frozen release imports OK')"
          if ($LASTEXITCODE -ne 0) { throw "release import probe failed with exit $LASTEXITCODE" }

      - name: Assemble runtime, selftest, and build the NSIS installer
        working-directory: source
        shell: pwsh
        # The source repository moved its release scripts to scripts/release
        # (Silvia-Supra #101). Older tags keep them in scripts/, so use
        # whichever this source_ref has.
        run: |
          $script = "scripts/release/build_desktop.ps1"
          if (-not (Test-Path $script)) { $script = "scripts/build_desktop.ps1" }
          pwsh -File $script -Installer -Channel release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Read whether the source pins an update signing key
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          # desktop/update-keys.json holds the public halves of Supra's update
          # signing keys (Silvia-Supra desktop/update-signing.js). An app built
          # with one installs only signed updates, so its release must be
          # signed: the publish job refuses to publish it unsigned. Older
          # sources have no such file and are published as before.
          keys=source/desktop/update-keys.json
          if [ -f "$keys" ] && grep -q '"public_key"' "$keys"; then
            echo "required=true" >> "$GITHUB_OUTPUT"
          else
            echo "required=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify installer and record checksum
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          cd source/desktop/dist
          installer="$(ls Supra-Setup-*.exe | head -1)"
          test -s "$installer"
          test -s latest.yml

          # The documented nastiest failure in this chain: electron-builder
          # quietly writing a DIFFERENT name into latest.yml than the file it
          # saved. build_desktop.ps1 asserts this too; assert it again here,
          # because a 404 in the update feed reports to users as "up to date".
          feed_path="$(grep -E '^\s*path:' latest.yml | head -1 | sed 's/.*path:[[:space:]]*//' | tr -d '\r')"
          echo "installer=$installer feed_path=$feed_path"
          test "$feed_path" = "$installer"

          sha="$(sha256sum "$installer" | cut -d' ' -f1)"
          echo "$sha  $installer" > "$installer.sha256"
          echo "installer=$installer" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          {
            echo "### Verified Windows x64 installer"
            echo
            echo "- Source: \`${SOURCE_REF}\`"
            echo "- Release: \`${RELEASE_TAG}\`"
            echo "- Installer: \`$installer\`"
            echo "- latest.yml path: \`$feed_path\`"
            echo "- SHA-256: \`$sha\`"
            echo "- Publish requested: \`${PUBLISH}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Hand the verified files to the publish job
        if: ${{ inputs.publish }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer
          retention-days: 1
          if-no-files-found: error
          path: |
            source/desktop/dist/${{ steps.artifact.outputs.installer }}
            source/desktop/dist/${{ steps.artifact.outputs.installer }}.sha256
            source/desktop/dist/latest.yml
            source/desktop/dist/INSTALLER_STAMP.json

  publish:
    name: Publish the verified installer
    needs: build
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The only job that can write a release. It checks out nothing and runs
    # nothing from the source repository.
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      INSTALLER: ${{ needs.build.outputs.installer }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-installer
          path: dist

      - name: Sign the update files
        # The app checks this signature before it installs an update
        # (Silvia-Supra desktop/update-signing.js): an Ed25519 signature over
        # "supra-update-v1", the file's name, its SHA-256 and the version, one
        # line each, made with the key only this secret holds. Without the
        # secret, a source that pins a key is refused here; one that pins none
        # is published unsigned, as before.
        env:
          SIGNING_KEY: ${{ secrets.SUPRA_UPDATE_SIGNING_KEY }}
          REQUIRED: ${{ needs.build.outputs.signing_required }}
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          if [ -z "${SIGNING_KEY}" ]; then
            if [ "${REQUIRED}" = "true" ]; then
              echo "::error::This source pins an update signing key, and SUPRA_UPDATE_SIGNING_KEY is not set: installed copies would refuse an unsigned update."
              exit 1
            fi
            echo "No signing key, and the source pins none: published unsigned, as before."
            exit 0
          fi
          version="${RELEASE_TAG#v}"
          key="$RUNNER_TEMP/update-key.pem"
          umask 077
          printf '%s\n' "${SIGNING_KEY}" > "$key"
          trap 'rm -f "$key" "$RUNNER_TEMP/update-message"' EXIT
          for name in "$INSTALLER"; do
            sha="$(sha256sum "$name" | cut -d' ' -f1)"
            printf 'supra-update-v1\n%s\n%s\n%s\n' "$name" "$sha" "$version" > "$RUNNER_TEMP/update-message"
            openssl pkeyutl -sign -inkey "$key" -rawin -in "$RUNNER_TEMP/update-message" | base64 -w0 > "$name.sig"
            test "$(base64 -d "$name.sig" | wc -c)" -eq 64
            echo "signed $name"
          done

      - name: Publish public recovery assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          test -s "$INSTALLER"
          (sha256sum -c "$INSTALLER.sha256")
          cp "$INSTALLER" Supra-Setup.exe
          signatures=()
          # The app reads the signature of the file the update feed names.
          [ -f "$INSTALLER.sig" ] && signatures+=("$INSTALLER.sig")
          gh release upload "${RELEASE_TAG}" \
            "$INSTALLER" \
            "$INSTALLER.sha256" \
            "${signatures[@]}" \
            Supra-Setup.exe latest.yml INSTALLER_STAMP.json \
            --repo "$GITHUB_REPOSITORY" --clobber
