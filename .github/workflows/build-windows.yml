name: Build Windows installer

# The Windows counterpart to "Build macOS installer". Until this existed, the
# Windows half of a release could only be cut from somebody's laptop, which is
# why scripts/build_desktop.ps1 calls a build venv "a BUILD machine
# requirement": there was always a machine.
#
# Recovery releases are public while the unfinished account system is offline.
# A publish run attaches the verified installer and metadata to GitHub.

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Commit, tag, or branch from the private source repository
        required: true
        default: main
        type: string
      release_tag:
        description: Version tag (must match desktop/package.json)
        required: true
        default: v0.9.1
        type: string
      publish:
        description: Publish the verified installer to the public GitHub release
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: windows-installer
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify Windows x64
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Check out private source with repository-scoped read-only key
        uses: actions/checkout@v5
        with:
          repository: LinusDaniel77/Silvia-Supra
          ref: ${{ inputs.source_ref }}
          ssh-key: ${{ secrets.SUPRA_SOURCE_DEPLOY_KEY }}
          persist-credentials: false
          path: source

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            source/web/package-lock.json
            source/desktop/package-lock.json

      # build_desktop.ps1 asks the build interpreter for its exact version and
      # downloads the matching python-<version>-embed-amd64.zip. Pin PATCH: a
      # floating 3.13 silently moved the release builder from the locally proven
      # 3.13.9 runtime to 3.13.15, whose native CAD stack returned 0 and then
      # crashed during interpreter teardown with 0xC0000374.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.9"

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: source/uv.lock

      - name: Confirm the release tag matches the source
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./source/desktop/package.json').version")"
          echo "package_version=$version release_tag=${{ inputs.release_tag }}"
          test "v$version" = "${{ inputs.release_tag }}"

      - name: Build web application
        working-directory: source/web
        run: |
          npm ci
          npm run build

      - name: Install desktop packaging dependencies
        working-directory: source/desktop
        run: npm ci

      # "No build venv at .venv313 (this is a BUILD machine requirement only)."
      # The runner is the build machine now, so it grows one.
      - name: Create the build venv the installer is assembled from
        working-directory: source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:UV_PROJECT_ENVIRONMENT = ".venv313"
          uv sync --frozen --no-dev --python python
          if ($LASTEXITCODE -ne 0) { throw "uv sync failed with exit $LASTEXITCODE" }

          # build_desktop.ps1 reads the interpreter version out of pyvenv.cfg to
          # pick the matching python-<version>-embed-amd64.zip, and its parser
          # matches `^\s*version\s*=` -- the spelling the stdlib venv writes.
          # uv writes `version_info = 3.13.9` instead, so the script cannot read
          # a uv-made venv and stops at "Could not read the Python version from
          # pyvenv.cfg" before assembling anything. Add the stdlib spelling.
          $cfg = ".venv313\pyvenv.cfg"
          if (-not (Select-String -Path $cfg -Pattern '^\s*version\s*=' -Quiet)) {
            $v = & .\.venv313\Scripts\python.exe -c "import sys; print('.'.join(map(str, sys.version_info[:3])))"
            if ($LASTEXITCODE -ne 0) { throw "could not read the venv interpreter version" }
            Add-Content -Path $cfg -Value "version = $v"
            Write-Host "pyvenv.cfg: added stdlib-style 'version = $v' for build_desktop.ps1"
          }

          # Import the native CAD stack and require a clean interpreter exit.
          # Merely printing success is insufficient: incompatible CasADi builds
          # have printed it and then crashed during Windows process teardown.
          & .\.venv313\Scripts\python.exe -c "import sys, cadquery, vtkmodules, pydantic, fastapi, anthropic, silvia; print(sys.version); print('frozen release imports OK')"
          if ($LASTEXITCODE -ne 0) { throw "release import probe failed with exit $LASTEXITCODE" }

      - name: Assemble runtime, selftest, and build the NSIS installer
        working-directory: source
        shell: pwsh
        run: pwsh -File scripts/build_desktop.ps1 -Installer -Channel release

      - name: Verify installer and record checksum
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          cd source/desktop/dist
          installer="$(ls Supra-Setup-*.exe | head -1)"
          test -s "$installer"
          test -s latest.yml

          # The documented nastiest failure in this chain: electron-builder
          # quietly writing a DIFFERENT name into latest.yml than the file it
          # saved. build_desktop.ps1 asserts this too; assert it again here,
          # because a 404 in the update feed reports to users as "up to date".
          feed_path="$(grep -E '^\s*path:' latest.yml | head -1 | sed 's/.*path:[[:space:]]*//' | tr -d '\r')"
          echo "installer=$installer feed_path=$feed_path"
          test "$feed_path" = "$installer"

          sha="$(sha256sum "$installer" | cut -d' ' -f1)"
          echo "$sha  $installer" > "$installer.sha256"
          echo "installer=$installer" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          {
            echo "### Verified Windows x64 installer"
            echo
            echo "- Source: \`${{ inputs.source_ref }}\`"
            echo "- Release: \`${{ inputs.release_tag }}\`"
            echo "- Installer: \`$installer\`"
            echo "- latest.yml path: \`$feed_path\`"
            echo "- SHA-256: \`$sha\`"
            echo "- Publish requested: \`${{ inputs.publish }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish public recovery assets
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd source/desktop/dist
          cp "${{ steps.artifact.outputs.installer }}" Supra-Setup.exe
          gh release upload "${{ inputs.release_tag }}" \
            "${{ steps.artifact.outputs.installer }}" \
            "${{ steps.artifact.outputs.installer }}.sha256" \
            Supra-Setup.exe latest.yml INSTALLER_STAMP.json \
            --repo "$GITHUB_REPOSITORY" --clobber
