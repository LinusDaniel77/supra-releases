name: Launch like a person (Windows, Mac)

# The release verifier's --smoke launch never opens the windows a person sees,
# which is how 0.11.12 to 0.11.32 shipped an empty terms window. This installs
# a published build and walks the real path: terms text, Accept, launch screen,
# engine, app window, Settings, and a second launch. Runs on the working branch
# when it changes, or by hand for any tag.
on:
  push:
    branches: [claude/supra-handoff-prompt-1zp1t5]
    paths:
      - .github/workflows/launch-test.yml
      - scripts/launch_like_a_person.py
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to install and launch
        required: true

permissions:
  contents: read

jobs:
  launch:
    name: ${{ matrix.name }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            runner: windows-latest
          - name: mac-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Test dependencies
        run: python -m pip install --disable-pip-version-check websocket-client==1.8.0 pillow==11.3.0
      - name: Install the published app and launch it like a person
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || 'v0.11.35' }}
        run: python scripts/launch_like_a_person.py
