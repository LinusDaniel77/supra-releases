name: Publish public release notes

# Publishes notes only. Customer installers and updater manifests must never be
# attached to this public repository; platform workflows send signed artifacts
# directly to Supra's entitlement-gated private storage.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v0.8.0 (must match desktop/package.json)
        required: true
        type: string
      title:
        description: Release title, e.g. Supra 0.8.0
        required: true
        type: string
      prerelease:
        description: >-
          Mark public notes as prerelease until the protected build is active.
        required: true
        default: true
        type: boolean
      body:
        description: Release notes (markdown)
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: create-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  create:
    name: Create ${{ inputs.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Refuse to clobber an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${{ inputs.tag }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::${{ inputs.tag }} already exists. Delete it first, or pick another tag."
            exit 1
          fi
          echo "${{ inputs.tag }} does not exist yet — safe to create."

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes_file="$(mktemp)"
          cat >"$notes_file" <<'NOTES'
          ${{ inputs.body }}
          NOTES
          gh release create "${{ inputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "${{ inputs.title }}" \
            --notes-file "$notes_file" \
            ${{ inputs.prerelease && '--prerelease' || '' }}

      - name: Report
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          url="$(gh release view "${{ inputs.tag }}" --repo "$GITHUB_REPOSITORY" --json url --jq .url)"
          {
            echo "### Created \`${{ inputs.tag }}\`"
            echo
            echo "- Title: ${{ inputs.title }}"
            echo "- Prerelease: \`${{ inputs.prerelease }}\`"
            echo "- URL: $url"
            echo
            echo "No artifacts are attached by design. Signed customer builds are delivered"
            echo "only through Supra's account- and entitlement-gated private storage."
          } >> "$GITHUB_STEP_SUMMARY"
