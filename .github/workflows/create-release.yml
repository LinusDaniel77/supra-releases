name: Create public release

# Creates the public release that platform build workflows populate with
# verified installers, updater metadata, and checksums.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v0.8.0 (must match desktop/package.json)
        required: true
        type: string
      title:
        description: Release title, e.g. Supra 0.8.0
        required: true
        type: string
      prerelease:
        description: >-
          Mark public notes as prerelease until the protected build is active.
        required: true
        default: true
        type: boolean
      body:
        description: Release notes (markdown)
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: create-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  create:
    name: Create ${{ inputs.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Inputs reach the shell ONLY through these variables, never as ${{ }}
    # spliced into a script. GitHub substitutes an expression into the script
    # text before bash parses it, so a title containing $(...) or a quote, or a
    # release-notes line reading NOTES (which ended the old heredoc early),
    # would have run as shell with this job's contents: write token.
    env:
      TAG: ${{ inputs.tag }}
      TITLE: ${{ inputs.title }}
      BODY: ${{ inputs.body }}
      PRERELEASE: ${{ inputs.prerelease }}

    steps:
      - name: Refuse a malformed tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag must look like v1.2.3 or v1.2.3-beta.1; got: $TAG"
            exit 1
          fi

      - name: Refuse to clobber an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::$TAG already exists. Delete it first, or pick another tag."
            exit 1
          fi
          echo "$TAG does not exist yet: safe to create."

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes_file="$(mktemp)"
          printf '%s\n' "$BODY" >"$notes_file"
          prerelease_flag=()
          if [ "$PRERELEASE" = "true" ]; then prerelease_flag=(--prerelease); fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TITLE" \
            --notes-file "$notes_file" \
            "${prerelease_flag[@]}"

      - name: Report
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          url="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url)"
          {
            echo "### Created \`$TAG\`"
            echo
            echo "- Title: $TITLE"
            echo "- Prerelease: \`$PRERELEASE\`"
            echo "- URL: $url"
            echo
            echo "Platform build workflows attach verified public-beta installers and checksums."
          } >> "$GITHUB_STEP_SUMMARY"
