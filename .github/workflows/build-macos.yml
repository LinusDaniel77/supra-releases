name: Build macOS installer

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: Mac architecture to build
        required: true
        default: arm64
        type: choice
        options:
          - arm64
          - x64
      source_ref:
        description: Commit, tag, or branch from the private source repository
        required: true
        default: main
        type: string
      release_tag:
        description: Version tag, e.g. v0.11.52 (must match desktop/package.json at source_ref)
        required: true
        type: string
      publish:
        description: Publish the verified beta DMG to the public GitHub release
        required: true
        default: false
        type: boolean

# Read-only by default. The build job runs code from source_ref (npm scripts,
# build tools, the project's own build script, its node_modules), so it must
# never hold a token that can write this repository's releases (security audit
# 2026-11, h14). Only the publish job below can, and it runs no code from the
# source repository.
permissions:
  contents: read

concurrency:
  group: macos-installer-${{ inputs.architecture }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify macOS ${{ inputs.architecture }}
    runs-on: ${{ inputs.architecture == 'arm64' && 'macos-15' || 'macos-15-intel' }}
    timeout-minutes: 120
    outputs:
      signing_required: ${{ steps.signing.outputs.required }}
    # Inputs reach run: scripts only through these variables. An expression
    # spliced into a script is substituted before the shell parses it, so a
    # value with a quote or $(...) in it would run as code.
    env:
      ARCHITECTURE: ${{ inputs.architecture }}
      PUBLISH: ${{ inputs.publish }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      SOURCE_REF: ${{ inputs.source_ref }}
      SUPRA_REQUIRE_MAC_NOTARIZATION: "0"

    steps:
      - name: Check out private source with repository-scoped read-only key
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: LinusDaniel77/Silvia-Supra
          ref: ${{ inputs.source_ref }}
          ssh-key: ${{ secrets.SUPRA_SOURCE_DEPLOY_KEY }}
          persist-credentials: false
          path: source

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            source/web/package-lock.json
            source/desktop/package-lock.json

      - name: Confirm release and native runner architecture
        shell: bash
        run: |
          set -euo pipefail
          expected_arch="${ARCHITECTURE}"
          actual_arch="$(node -p 'process.arch')"
          version="$(node -p "require('./source/desktop/package.json').version")"
          echo "runner=$(uname -a)"
          echo "node_arch=$actual_arch expected=$expected_arch"
          echo "package_version=$version release_tag=${RELEASE_TAG}"
          test "$actual_arch" = "$expected_arch"
          test "v$version" = "${RELEASE_TAG}"

      - name: Build web application
        working-directory: source/web
        run: |
          npm ci
          npm run build
          npm run kernel:bundle

      - name: Install desktop packaging dependencies
        working-directory: source/desktop
        run: npm ci

      - name: Test updater, native signature, and rollback paths
        working-directory: source/desktop
        run: npm run check

      - name: Assemble verified native runtime and DMG
        working-directory: source
        env:
          # The builder queries python-build-standalone's public release API.
          # Authenticate with this run's short-lived token to avoid the very
          # low anonymous GitHub API rate limit during repeated release tests.
          GITHUB_TOKEN: ${{ github.token }}
        # The source repository moved its release scripts to scripts/release
        # (Silvia-Supra #101). Older tags keep them in scripts/, so use
        # whichever this source_ref has.
        run: |
          set -euo pipefail
          script=scripts/release/build_desktop_macos.py
          [ -f "$script" ] || script=scripts/build_desktop_macos.py
          python3 "$script" --installer

      - name: Read whether the source pins an update signing key
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          # desktop/update-keys.json holds the public halves of Supra's update
          # signing keys (Silvia-Supra desktop/update-signing.js). An app built
          # with one installs only signed updates, so its release must be
          # signed: the publish job refuses to publish it unsigned. Older
          # sources have no such file and are published as before.
          keys=source/desktop/update-keys.json
          if [ -f "$keys" ] && grep -q '"public_key"' "$keys"; then
            echo "required=true" >> "$GITHUB_OUTPUT"
          else
            echo "required=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify installer and record checksum
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          dmg="source/desktop/dist/Supra-Setup-Mac-${ARCHITECTURE}.dmg"
          checksum="$dmg.sha256"
          test -s "$dmg"
          hdiutil verify "$dmg"
          if [ "$ARCHITECTURE" = "arm64" ]; then app_dir="mac-arm64"; else app_dir="mac"; fi
          app="source/desktop/dist/${app_dir}/Supra.app"
          test -x "$app/Contents/MacOS/Supra"
          # The oldest macOS this build runs on, read from the app itself. The
          # publish step writes it into the update feed so an installed app on
          # an older Mac is never offered an update that will not open there.
          min_macos="$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app/Contents/Info.plist")"
          test -n "$min_macos"
          # Hashed from inside dist so the file names only the DMG: a user who
          # downloads both into one folder can then run `shasum -c` on it.
          # Up to v0.11.52 it named source/desktop/dist/..., which no download
          # folder has, so the check reported the file missing.
          (cd "$(dirname "$dmg")" && shasum -a 256 "$(basename "$dmg")") | tee "$checksum"
          (cd "$(dirname "$dmg")" && shasum -a 256 -c "$(basename "$checksum")")
          {
            echo "dmg=$dmg"
            echo "checksum=$checksum"
            echo "min_macos=$min_macos"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Verified macOS ${ARCHITECTURE} installer"
            echo
            echo "- Source: \`${SOURCE_REF}\`"
            echo "- Release: \`${RELEASE_TAG}\`"
            echo "- DMG: \`$(basename "$dmg")\`"
            echo "- SHA-256: \`$(cut -d ' ' -f 1 "$checksum")\`"
            echo "- Minimum macOS: \`$min_macos\`"
            echo "- Publish requested: \`${PUBLISH}\`"
            echo
            echo "Public beta recovery build. Developer ID signing and notarization are not configured."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write this architecture's update feed
        if: ${{ inputs.publish }}
        env:
          MIN_MACOS: ${{ steps.artifact.outputs.min_macos }}
        shell: bash
        run: |
          set -euo pipefail
          metadata="source/desktop/dist/latest-mac-${ARCHITECTURE}.yml"
          cp source/desktop/dist/latest-mac.yml "$metadata"

          # THE UPDATE FEED CARRIES THE OS FLOOR, IN DARWIN TERMS. electron-builder
          # sets LSMinimumSystemVersion in the app but writes no
          # minimumSystemVersion into latest-mac.yml, so every installed app was
          # offered every update whatever its Mac could run. electron-updater
          # skips an update whose minimumSystemVersion is above os.release(),
          # and on a Mac os.release() is the DARWIN kernel version (macOS 12 is
          # Darwin 21), so a floor written as "12.0.0" would compare Darwin 20
          # (macOS 11) as newer and offer the update anyway. An unparseable
          # value is also treated as "offer it". So the macOS floor is
          # translated to its Darwin version and written as full semver, and a
          # floor this table does not know stops the publish instead of
          # shipping a feed that protects nobody.
          node - "$metadata" <<'NODE'
          const fs = require('fs');
          const yaml = require('./source/desktop/node_modules/js-yaml');
          const file = process.argv[2];
          const macos = String(process.env.MIN_MACOS || '').trim();
          const DARWIN = {
            '10.13': 17, '10.14': 18, '10.15': 19,
            '11': 20, '12': 21, '13': 22, '14': 23, '15': 24, '26': 25,
          };
          const [major, minor] = macos.split('.');
          const key = major === '10' ? `10.${minor}` : major;
          const darwin = DARWIN[key];
          if (!darwin) throw new Error(`no Darwin version known for macOS ${macos}; add it before publishing`);
          const doc = yaml.load(fs.readFileSync(file, 'utf8'));
          doc.minimumSystemVersion = `${darwin}.0.0`;
          fs.writeFileSync(file, yaml.dump(doc, { lineWidth: -1 }));
          console.log(`macOS ${macos} -> feed minimumSystemVersion ${doc.minimumSystemVersion}`);
          NODE

      - name: Hand the verified files to the publish job
        if: ${{ inputs.publish }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-${{ inputs.architecture }}
          retention-days: 1
          if-no-files-found: error
          path: |
            ${{ steps.artifact.outputs.dmg }}
            ${{ steps.artifact.outputs.checksum }}
            source/desktop/dist/latest-mac-${{ inputs.architecture }}.yml

  publish:
    name: Publish the verified installer
    needs: build
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The only job that can write a release. It checks out nothing and runs
    # nothing from the source repository; the feed is combined with a pinned
    # YAML library, never with the source's own node_modules.
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      ARCHITECTURE: ${{ inputs.architecture }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-${{ inputs.architecture }}
          path: dist

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Sign the update files
        # The app checks this signature before it installs an update
        # (Silvia-Supra desktop/update-signing.js): an Ed25519 signature over
        # "supra-update-v1", the file's name, its SHA-256 and the version, one
        # line each, made with the key only this secret holds. Without the
        # secret, a source that pins a key is refused here; one that pins none
        # is published unsigned, as before.
        env:
          SIGNING_KEY: ${{ secrets.SUPRA_UPDATE_SIGNING_KEY }}
          REQUIRED: ${{ needs.build.outputs.signing_required }}
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          if [ -z "${SIGNING_KEY}" ]; then
            if [ "${REQUIRED}" = "true" ]; then
              echo "::error::This source pins an update signing key, and SUPRA_UPDATE_SIGNING_KEY is not set: installed copies would refuse an unsigned update."
              exit 1
            fi
            echo "No signing key, and the source pins none: published unsigned, as before."
            exit 0
          fi
          version="${RELEASE_TAG#v}"
          key="$RUNNER_TEMP/update-key.pem"
          umask 077
          printf '%s\n' "${SIGNING_KEY}" > "$key"
          trap 'rm -f "$key" "$RUNNER_TEMP/update-message"' EXIT
          for name in "Supra-Setup-Mac-${ARCHITECTURE}.dmg"; do
            sha="$(sha256sum "$name" | cut -d' ' -f1)"
            printf 'supra-update-v1\n%s\n%s\n%s\n' "$name" "$sha" "$version" > "$RUNNER_TEMP/update-message"
            openssl pkeyutl -sign -inkey "$key" -rawin -in "$RUNNER_TEMP/update-message" | base64 -w0 > "$name.sig"
            test "$(base64 -d "$name.sig" | wc -c)" -eq 64
            echo "signed $name"
          done

      - name: Publish public recovery assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          dmg="Supra-Setup-Mac-${ARCHITECTURE}.dmg"
          metadata="latest-mac-${ARCHITECTURE}.yml"
          test -s "$dmg" && test -s "$metadata"
          shasum -a 256 -c "$dmg.sha256"
          signatures=()
          [ -f "$dmg.sig" ] && signatures+=("$dmg.sig")
          gh release upload "${RELEASE_TAG}" "$dmg" "$dmg.sha256" "${signatures[@]}" "$metadata" \
            --repo "$GITHUB_REPOSITORY" --clobber

          # The updater reads one channel file on both Mac architectures. Once
          # both native jobs have published their individual metadata, combine
          # their file lists. electron-updater then selects the URL containing
          # process.arch, so an Intel Mac can never receive an arm64 DMG (or the
          # reverse). The first job simply leaves its architecture file behind;
          # whichever job sees both completes the channel atomically.
          gh release download "${RELEASE_TAG}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern latest-mac-arm64.yml \
            --pattern latest-mac-x64.yml \
            --dir combined-metadata || true
          if [[ -f combined-metadata/latest-mac-arm64.yml && \
                -f combined-metadata/latest-mac-x64.yml ]]; then
            python -m pip install --quiet "pyyaml==6.0.2"
            python - <<'PY'
          import yaml

          arm = yaml.safe_load(open("combined-metadata/latest-mac-arm64.yml", encoding="utf-8"))
          x64 = yaml.safe_load(open("combined-metadata/latest-mac-x64.yml", encoding="utf-8"))
          if arm.get("version") != x64.get("version"):
              raise SystemExit("Mac metadata versions differ")
          if not arm.get("minimumSystemVersion") or not x64.get("minimumSystemVersion"):
              raise SystemExit("Mac metadata is missing minimumSystemVersion; refusing to publish an unguarded feed")


          def number(version):
              return [int(part) for part in str(version).split(".")[:3]] + [0] * 3


          # The higher of the two floors, compared numerically.
          floor = max(arm["minimumSystemVersion"], x64["minimumSystemVersion"], key=lambda v: number(v)[:3])
          combined = {**arm, "files": list(arm.get("files") or []) + list(x64.get("files") or []),
                      "minimumSystemVersion": floor}
          with open("latest-mac.yml", "w", encoding="utf-8") as out:
              yaml.safe_dump(combined, out, sort_keys=False, width=10_000)
          PY
            gh release upload "${RELEASE_TAG}" latest-mac.yml \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            echo "The other architecture metadata is not available yet; its job will finish the channel."
          fi
