name: Build macOS installer

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: Mac architecture to build
        required: true
        default: arm64
        type: choice
        options:
          - arm64
          - x64
      source_ref:
        description: Commit, tag, or branch from the private source repository
        required: true
        default: main
        type: string
      release_tag:
        description: Version tag (must match desktop/package.json)
        required: true
        default: v0.9.1
        type: string
      publish:
        description: Publish the verified beta DMG to the public GitHub release
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: macos-installer-${{ inputs.architecture }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify macOS ${{ inputs.architecture }}
    runs-on: ${{ inputs.architecture == 'arm64' && 'macos-15' || 'macos-15-intel' }}
    timeout-minutes: 120
    env:
      SUPRA_REQUIRE_MAC_NOTARIZATION: "0"

    steps:
      - name: Check out private source with repository-scoped read-only key
        uses: actions/checkout@v5
        with:
          repository: LinusDaniel77/Silvia-Supra
          ref: ${{ inputs.source_ref }}
          ssh-key: ${{ secrets.SUPRA_SOURCE_DEPLOY_KEY }}
          persist-credentials: false
          path: source

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            source/web/package-lock.json
            source/desktop/package-lock.json

      - name: Confirm release and native runner architecture
        shell: bash
        run: |
          set -euo pipefail
          expected_arch="${{ inputs.architecture }}"
          actual_arch="$(node -p 'process.arch')"
          version="$(node -p "require('./source/desktop/package.json').version")"
          echo "runner=$(uname -a)"
          echo "node_arch=$actual_arch expected=$expected_arch"
          echo "package_version=$version release_tag=${{ inputs.release_tag }}"
          test "$actual_arch" = "$expected_arch"
          test "v$version" = "${{ inputs.release_tag }}"

      - name: Build web application
        working-directory: source/web
        run: |
          npm ci
          npm run build

      - name: Install desktop packaging dependencies
        working-directory: source/desktop
        run: npm ci

      - name: Assemble verified native runtime and DMG
        working-directory: source
        env:
          # The builder queries python-build-standalone's public release API.
          # Authenticate with this run's short-lived token to avoid the very
          # low anonymous GitHub API rate limit during repeated release tests.
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/build_desktop_macos.py --installer

      - name: Verify installer and record checksum
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          dmg="source/desktop/dist/Supra-Setup-Mac-${{ inputs.architecture }}.dmg"
          checksum="$dmg.sha256"
          test -s "$dmg"
          hdiutil verify "$dmg"
          app="source/desktop/dist/${{ inputs.architecture == 'arm64' && 'mac-arm64' || 'mac' }}/Supra.app"
          test -x "$app/Contents/MacOS/Supra"
          shasum -a 256 "$dmg" | tee "$checksum"
          echo "dmg=$dmg" >> "$GITHUB_OUTPUT"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"
          {
            echo "### Verified macOS ${{ inputs.architecture }} installer"
            echo
            echo "- Source: \`${{ inputs.source_ref }}\`"
            echo "- Release: \`${{ inputs.release_tag }}\`"
            echo "- DMG: \`$(basename "$dmg")\`"
            echo "- SHA-256: \`$(cut -d ' ' -f 1 "$checksum")\`"
            echo "- Publish requested: \`${{ inputs.publish }}\`"
            echo
            echo "Public beta recovery build. Developer ID signing and notarization are not configured."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish public recovery assets
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          metadata="latest-mac-${{ inputs.architecture }}.yml"
          cp source/desktop/dist/latest-mac.yml "$metadata"
          gh release upload "${{ inputs.release_tag }}" \
            "${{ steps.artifact.outputs.dmg }}" \
            "${{ steps.artifact.outputs.checksum }}" \
            "$metadata" \
            --repo "$GITHUB_REPOSITORY" --clobber

          # The updater reads one channel file on both Mac architectures. Once
          # both native jobs have published their individual metadata, combine
          # their file lists. electron-updater then selects the URL containing
          # process.arch, so an Intel Mac can never receive an arm64 DMG (or the
          # reverse). The first job simply leaves its architecture file behind;
          # whichever job sees both completes the channel atomically.
          gh release download "${{ inputs.release_tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern latest-mac-arm64.yml \
            --pattern latest-mac-x64.yml \
            --dir combined-metadata || true
          if [[ -f combined-metadata/latest-mac-arm64.yml && \
                -f combined-metadata/latest-mac-x64.yml ]]; then
            node - <<'NODE'
          const fs = require('fs');
          const yaml = require('./source/desktop/node_modules/js-yaml');
          const arm = yaml.load(fs.readFileSync('combined-metadata/latest-mac-arm64.yml', 'utf8'));
          const x64 = yaml.load(fs.readFileSync('combined-metadata/latest-mac-x64.yml', 'utf8'));
          if (arm.version !== x64.version) throw new Error('Mac metadata versions differ');
          const combined = { ...arm, files: [...(arm.files || []), ...(x64.files || [])] };
          fs.writeFileSync('latest-mac.yml', yaml.dump(combined, { lineWidth: -1 }));
          NODE
            gh release upload "${{ inputs.release_tag }}" latest-mac.yml \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            echo "The other architecture metadata is not available yet; its job will finish the channel."
          fi
