name: Build macOS installer

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: Mac architecture to build
        required: true
        default: arm64
        type: choice
        options:
          - arm64
          - x64
      source_ref:
        description: Commit, tag, or branch from the private source repository
        required: true
        default: main
        type: string
      release_tag:
        description: Version tag (must match desktop/package.json)
        required: true
        default: v0.9.0
        type: string
      publish:
        description: Publish the signed and notarized DMG to protected storage
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: macos-installer-${{ inputs.architecture }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify macOS ${{ inputs.architecture }}
    runs-on: ${{ inputs.architecture == 'arm64' && 'macos-15' || 'macos-15-intel' }}
    timeout-minutes: 120
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Check out private source with repository-scoped read-only key
        uses: actions/checkout@v5
        with:
          repository: LinusDaniel77/Silvia-Supra
          ref: ${{ inputs.source_ref }}
          ssh-key: ${{ secrets.SUPRA_SOURCE_DEPLOY_KEY }}
          persist-credentials: false
          path: source

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            source/web/package-lock.json
            source/desktop/package-lock.json

      - name: Confirm release and native runner architecture
        shell: bash
        run: |
          set -euo pipefail
          expected_arch="${{ inputs.architecture }}"
          actual_arch="$(node -p 'process.arch')"
          version="$(node -p "require('./source/desktop/package.json').version")"
          echo "runner=$(uname -a)"
          echo "node_arch=$actual_arch expected=$expected_arch"
          echo "package_version=$version release_tag=${{ inputs.release_tag }}"
          test "$actual_arch" = "$expected_arch"
          test "v$version" = "${{ inputs.release_tag }}"

      - name: Build web application
        working-directory: source/web
        run: |
          npm ci
          npm run build

      - name: Install desktop packaging dependencies
        working-directory: source/desktop
        run: npm ci

      - name: Configure Developer ID signing and Apple notarization
        if: ${{ inputs.publish }}
        shell: bash
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.SUPRA_MAC_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.SUPRA_MAC_CERTIFICATE_PASSWORD }}
          API_KEY_P8_BASE64: ${{ secrets.SUPRA_APPLE_API_KEY_P8_BASE64 }}
          API_KEY_ID: ${{ secrets.SUPRA_APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.SUPRA_APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          test -n "$CERTIFICATE_P12_BASE64"
          test -n "$CERTIFICATE_PASSWORD"
          test -n "$API_KEY_P8_BASE64"
          test -n "$API_KEY_ID"
          test -n "$API_ISSUER"
          certificate="$RUNNER_TEMP/supra-developer-id.p12"
          api_key="$RUNNER_TEMP/AuthKey_${API_KEY_ID}.p8"
          printf '%s' "$CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate"
          printf '%s' "$API_KEY_P8_BASE64" | base64 --decode > "$api_key"
          chmod 600 "$certificate" "$api_key"
          {
            echo "CSC_LINK=$certificate"
            echo "CSC_KEY_PASSWORD=$CERTIFICATE_PASSWORD"
            echo "CSC_IDENTITY_AUTO_DISCOVERY=true"
            echo "APPLE_API_KEY=$api_key"
            echo "APPLE_API_KEY_ID=$API_KEY_ID"
            echo "APPLE_API_ISSUER=$API_ISSUER"
            echo "SUPRA_REQUIRE_MAC_NOTARIZATION=1"
          } >> "$GITHUB_ENV"

      - name: Assemble verified native runtime and DMG
        working-directory: source
        env:
          # The builder queries python-build-standalone's public release API.
          # Authenticate with this run's short-lived token to avoid the very
          # low anonymous GitHub API rate limit during repeated release tests.
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/build_desktop_macos.py --installer

      - name: Verify installer and record checksum
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          dmg="source/desktop/dist/Supra-Setup-Mac-${{ inputs.architecture }}.dmg"
          checksum="$dmg.sha256"
          test -s "$dmg"
          hdiutil verify "$dmg"
          shasum -a 256 "$dmg" | tee "$checksum"
          echo "dmg=$dmg" >> "$GITHUB_OUTPUT"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"
          {
            echo "### Verified macOS ${{ inputs.architecture }} installer"
            echo
            echo "- Source: \`${{ inputs.source_ref }}\`"
            echo "- Release: \`${{ inputs.release_tag }}\`"
            echo "- DMG: \`$(basename "$dmg")\`"
            echo "- SHA-256: \`$(cut -d ' ' -f 1 "$checksum")\`"
            echo "- Publish requested: \`${{ inputs.publish }}\`"
            echo
            echo "Customer publication requires Developer ID signing and Apple notarization."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to entitlement-gated private storage
        if: ${{ inputs.publish }}
        env:
          SUPRA_SUPABASE_URL: ${{ secrets.SUPRA_SUPABASE_URL }}
          SUPRA_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPRA_SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git -C source rev-parse HEAD)"
          version="${{ inputs.release_tag }}"
          version="${version#v}"
          python3 source/scripts/publish_installer.py \
            --artifact "${{ steps.artifact.outputs.dmg }}" \
            --version "$version" \
            --platform macos \
            --architecture "${{ inputs.architecture }}" \
            --channel stable \
            --minimum-plan beta \
            --source-commit "$source_commit" \
            --signature-status verified
