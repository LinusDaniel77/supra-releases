name: Verify published installers

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published stable release to install and launch
        type: string
        required: true
      previous_tag:
        description: Published stable release the upgrade jobs start from (empty picks the newest stable release older than release_tag)
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: verify-installed-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  install:
    name: ${{ matrix.name }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-clean
            runner: windows-latest
            upgrade: 'false'
          - name: windows-upgrade
            runner: windows-latest
            upgrade: 'true'
          - name: mac-arm64-clean
            runner: macos-15
            upgrade: 'false'
          # Known to fail until the Mac app is signed with a stable identity:
          # each ad-hoc signed release has a new signature, so macOS asks for
          # permission to read the keychain item the previous release made,
          # and nobody can answer on a runner. Users see that prompt after
          # every update. The job still runs and still shows red.
          - name: mac-arm64-upgrade
            runner: macos-15
            upgrade: 'true'
            known_failure: 'true'
          - name: mac-x64-clean
            runner: macos-15-intel
            upgrade: 'false'
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.known_failure == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Test verifier safety and input contracts
        run: python -m unittest discover -s scripts -p "test_*.py" -v
      - name: Download, verify, install, and cold-launch published application
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
          TEST_UPGRADE: ${{ matrix.upgrade }}
        run: python scripts/verify_installed_release.py
      - name: Preserve verification evidence (not installers)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installed-${{ matrix.name }}
          path: installed-evidence/
          if-no-files-found: warn
          retention-days: 14
