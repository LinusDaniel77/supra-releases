name: Verify published installers

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published stable release to install and launch
        type: string
        required: true
      previous_tag:
        description: Published stable release the upgrade jobs start from (empty picks the newest stable release older than release_tag)
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: verify-installed-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  install:
    name: ${{ matrix.name }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-clean
            runner: windows-latest
            upgrade: 'false'
          - name: windows-upgrade
            runner: windows-latest
            upgrade: 'true'
          - name: mac-arm64-clean
            runner: macos-15
            upgrade: 'false'
          - name: mac-arm64-upgrade
            runner: macos-15
            upgrade: 'true'
          - name: mac-x64-clean
            runner: macos-15-intel
            upgrade: 'false'
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Test verifier safety and input contracts
        run: python -m unittest discover -s scripts -p "test_*.py" -v
      - name: Download, verify, install, and cold-launch published application
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
          TEST_UPGRADE: ${{ matrix.upgrade }}
        run: python scripts/verify_installed_release.py
      - name: Preserve verification evidence (not installers)
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: installed-${{ matrix.name }}
          path: installed-evidence/
          if-no-files-found: warn
          retention-days: 14
