name: Keychain signing probe

# Temporary: does an ad-hoc signature with a fixed designated requirement let
# a rebuilt Supra.app read the keychain item the previous build made, without
# the prompt that hangs every update today (Silvia-Supra #118)?

on:
  push:
    branches: [claude/wonderful-curie-9yvdwz]
    paths: [.github/workflows/keychain-signing-probe.yml]

permissions:
  contents: read

jobs:
  probe:
    name: probe (${{ matrix.requirement }})
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        requirement: [default, identifier]
    env:
      REQUIREMENT: ${{ matrix.requirement }}
    steps:
      - name: Install v0.11.52 from its DMG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          gh release download v0.11.52 --repo "$GITHUB_REPOSITORY" --pattern Supra-Setup-Mac-arm64.dmg
          hdiutil attach Supra-Setup-Mac-arm64.dmg -readonly -nobrowse -mountpoint mnt
          ditto mnt/Supra.app app/Supra.app
          hdiutil detach mnt

      - name: Write the launcher
        run: |
          cat > "$RUNNER_TEMP/launch.py" <<'PY'
          import os, subprocess, sys
          env = {k: v for k, v in os.environ.items()
                 if not k.endswith("API_KEY") and k not in ("GH_TOKEN", "GITHUB_TOKEN")}
          exe = os.path.join(os.environ["RUNNER_TEMP"], "app/Supra.app/Contents/MacOS/Supra")
          proc = subprocess.Popen([exe, "--smoke"], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, env=env)
          try:
              out, _ = proc.communicate(timeout=180)
              text = out.decode("utf-8", "replace")
              print(text[-3000:])
              ok = "SMOKE OK" in text
              print(f"RESULT {sys.argv[1]}: {'launched' if ok else 'exited without SMOKE OK'} (exit {proc.returncode})")
              sys.exit(0 if ok else 1)
          except subprocess.TimeoutExpired:
              agent = subprocess.run(["pgrep", "-lx", "SecurityAgent"], capture_output=True, text=True).stdout
              proc.kill()
              print(f"RESULT {sys.argv[1]}: HUNG at 180 s; SecurityAgent running: {bool(agent.strip())}")
              sys.exit(2)
          PY

      - name: Sign build A and launch it (creates the keychain item)
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/app/Supra.app"
          sign() {
            rm -rf "$app/Contents/_CodeSignature"
            codesign --force --deep --sign - "$app"
            if [ "$REQUIREMENT" = identifier ]; then
              # Only the outer app: each helper keeps its own identifier.
              codesign --force --sign - -r='designated => identifier "dev.silviaai.supra"' "$app"
            fi
            codesign --verify --deep --strict "$app"
            codesign -d -r- "$app" 2>&1 | grep designated
            codesign -dv "$app" 2>&1 | grep CDHash
          }
          sign
          python3 "$RUNNER_TEMP/launch.py" A
          security find-generic-password -s "Supra Safe Storage" 2>&1 | grep -E 'svce|acct' || echo "no item found"
          echo "probe-$(date +%s)" > "$app/Contents/Resources/probe-change.txt"
          sign

      - name: Launch build B (reads the item build A made)
        run: python3 "$RUNNER_TEMP/launch.py" B
