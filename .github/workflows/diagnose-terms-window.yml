name: Diagnose terms window (Windows)

# One-off evidence for a report that the installed app's "Before you use
# Supra" window opens empty. Runs only when this file or its script changes on
# the working branch, never on main, and never accepts the terms.
on:
  push:
    branches: [claude/supra-handoff-prompt-1zp1t5]
    paths:
      - .github/workflows/diagnose-terms-window.yml
      - scripts/diagnose_terms_window.py

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Diagnostic dependencies
        run: python -m pip install --disable-pip-version-check websocket-client==1.8.0 pillow==11.3.0
      - name: Install the published app and record its terms window
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.11.32
        run: python scripts/diagnose_terms_window.py
