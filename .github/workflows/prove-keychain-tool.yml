name: Prove the keychain tool ends the Mac update prompt

# Whether a secret kept through /usr/bin/security can be read by the next
# ad-hoc signed build without macOS asking for the password (Silvia-Supra
# #118). See scripts/prove_keychain_tool.py. Runs by hand, and on a pull
# request that changes the probe.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/prove_keychain_tool.py
      - scripts/keychain_probe.c
      - .github/workflows/prove-keychain-tool.yml

permissions:
  contents: read

jobs:
  prove:
    name: Next build reads the secret, no prompt
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel, macos-26]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Two builds, the framework as control, the keychain tool as the claim
        run: python scripts/prove_keychain_tool.py
